% -------------------------------------------------------------------------
% SU2 Configuration: NACA 0012 Steady RANS Alpha-Sweep (Gate 2 Benchmark)
% Reference: NASA TMR 2D NACA 0012 Validation Case (Re_c = 3e6, M = 0.15)
% -------------------------------------------------------------------------

SOLVER= RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% Freestream conditions (Re_c = 3.0e6 at c = 1.0 m, standard sea-level air)
MACH_NUMBER= 0.15
AOA= 4.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 288.15
REYNOLDS_NUMBER= 3000000.0
REYNOLDS_LENGTH= 1.0

% Reference values
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% Boundary conditions
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% Numerical discretization
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 15.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 1.0, 100.0 )
ITER= 5000

CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05

CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO

% Convergence & CSV output for aero_scale_diag.py
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10

MESH_FILENAME= mesh_NACA0012_449x129.su2
MESH_FORMAT= SU2

TABULAR_FORMAT= CSV
VOLUME_FILENAME= flow_aoa4
SURFACE_FILENAME= surface_aoa4
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV, VOLUME_CSV )
OUTPUT_WRT_FREQ= 1000
